apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: istio-system
spec:
  interval: 5s
  chart:
    spec:
      chart: istiod
      version: "1.28.2"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
      interval: 5s
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    pilot:
      env:
        EXTERNAL_ISTIOD: false
