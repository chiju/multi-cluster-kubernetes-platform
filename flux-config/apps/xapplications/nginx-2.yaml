apiVersion: platform.example.com/v1alpha1
kind: XApplication
metadata:
  name: nginx-2
  namespace: apps
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  parameters:
    appName: nginx-2
    image: nginx:1.25
    namespace: demo-app
    port: 80
    replicas: 3
    targetCluster: workload-cluster-1
