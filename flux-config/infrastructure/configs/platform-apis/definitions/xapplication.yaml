apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xapplications.platform.example.com
spec:
  scope: Namespaced
  group: platform.example.com
  names:
    kind: XApplication
    plural: xapplications
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
  - name: v2
    served: true
    referenceable: false
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              parameters:
                type: object
                properties:
                  appName:
                    type: string
                    description: Name of the application
                  image:
                    type: string
                    description: Container image
                  replicas:
                    type: integer
                    description: Number of replicas
                    default: 2
                  port:
                    type: integer
                    description: Container port
                    default: 80
                  targetCluster:
                    type: string
                    description: Target workload cluster
                  namespace:
                    type: string
                    description: Kubernetes namespace
                    default: "default"
                required:
                - appName
                - image
                - targetCluster
            required:
            - parameters
          status:
            type: object
            properties:
              deploymentStatus:
                type: string
              serviceEndpoint:
                type: string
