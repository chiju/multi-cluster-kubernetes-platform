apiVersion: apiextensions.crossplane.io/v2
kind: Composition
metadata:
  name: application
  labels:
    provider: kubernetes
    service: application
spec:
  compositeTypeRef:
    apiVersion: platform.example.com/v1alpha1
    kind: XApplication
  mode: Pipeline
  pipeline:
  - step: patch-and-transform
    functionRef:
      name: function-patch-and-transform
    input:
      apiVersion: pt.fn.crossplane.io/v1beta1
      kind: Resources
      resources:
      - name: namespace
        base:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: demo-app
            labels:
              istio-injection: enabled
        patches:
        - type: FromCompositeFieldPath
          fromFieldPath: spec.parameters.namespace
          toFieldPath: metadata.name
      - name: deployment
        base:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: nginx-demo
            namespace: demo-app
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: nginx-demo
            template:
              metadata:
                labels:
                  app: nginx-demo
              spec:
                containers:
                - name: nginx
                  image: nginx:1.25
                  ports:
                  - containerPort: 80
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                    limits:
                      cpu: 200m
                      memory: 256Mi
        patches:
        - type: FromCompositeFieldPath
          fromFieldPath: spec.parameters.appName
          toFieldPath: metadata.name
        - type: FromCompositeFieldPath
          fromFieldPath: spec.parameters.namespace
          toFieldPath: metadata.namespace
        - type: FromCompositeFieldPath
          fromFieldPath: spec.parameters.image
          toFieldPath: spec.template.spec.containers[0].image
        - type: FromCompositeFieldPath
          fromFieldPath: spec.parameters.replicas
          toFieldPath: spec.replicas
        - type: FromCompositeFieldPath
          fromFieldPath: spec.parameters.port
          toFieldPath: spec.template.spec.containers[0].ports[0].containerPort
      - name: service
        base:
          apiVersion: v1
          kind: Service
          metadata:
            name: nginx-demo
            namespace: demo-app
          spec:
            selector:
              app: nginx-demo
            ports:
            - port: 80
              targetPort: 80
            type: ClusterIP
        patches:
        - type: FromCompositeFieldPath
          fromFieldPath: spec.parameters.appName
          toFieldPath: metadata.name
        - type: FromCompositeFieldPath
          fromFieldPath: spec.parameters.namespace
          toFieldPath: metadata.namespace
        - type: FromCompositeFieldPath
          fromFieldPath: spec.parameters.port
          toFieldPath: spec.ports[0].port
