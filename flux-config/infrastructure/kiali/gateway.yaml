apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kiali-gateway
  namespace: istio-system
spec:
  gatewayClassName: istio
  addresses:
  - value: istio-gateway.istio-ingress.svc.cluster.local
    type: Hostname
  listeners:
  - name: http
    hostname: kiali.local
    port: 80
    protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kiali-route
  namespace: istio-system
spec:
  parentRefs:
  - name: kiali-gateway
  hostnames:
  - kiali.local
  rules:
  - backendRefs:
    - name: kiali
      port: 20001
