apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: istio-system
spec:
  interval: 5s
  chart:
    spec:
      chart: base
      version: "1.29.2"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
      interval: 5s
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    defaultRevision: default
