apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 10s
  chart:
    spec:
      chart: external-secrets
      version: "1.2.1"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
      interval: 10s
  targetNamespace: external-secrets-system
  install:
    createNamespace: true
  values:
    serviceAccount:
      create: true
      name: external-secrets
    installCRDs: true
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
